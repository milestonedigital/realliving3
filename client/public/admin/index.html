<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TinaCMS - REALiving Admin</title>
    <script async src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
      }
      
      .tina-loading {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      }
      
      .tina-loader {
        text-align: center;
        background: white;
        padding: 60px 40px;
        border-radius: 12px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      }
      
      .spinner {
        width: 50px;
        height: 50px;
        border: 4px solid #f3f3f3;
        border-top: 4px solid #667eea;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto 20px;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      .tina-header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 20px;
        text-align: center;
      }
      
      .tina-header h1 {
        font-size: 28px;
        font-weight: 700;
        margin: 0;
      }
      
      .tina-header p {
        margin: 5px 0 0 0;
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div id="tina"></div>
    
    <script src="https://unpkg.com/tinacms/dist/tinacms.min.js"></script>
    <script src="https://unpkg.com/@tinacms/cli@latest/dist/index.umd.js"></script>
    
    <script>
      // Initialize TinaCMS
      window.addEventListener('DOMContentLoaded', function() {
        console.log('TinaCMS Admin Loading...');
        
        // Show loading state
        const root = document.getElementById('tina');
        root.innerHTML = `
          <div class="tina-loading">
            <div class="tina-loader">
              <div class="spinner"></div>
              <h2 style="color: #333; margin: 0 0 10px 0;">TinaCMS Admin</h2>
              <p style="color: #666; margin: 0;">REALiving Content Management System</p>
              <p style="color: #999; font-size: 14px; margin: 20px 0 0 0;">Loading editor...</p>
            </div>
          </div>
        `;
        
        // Check if TinaCMS is loaded
        if (window.TinaCMS) {
          console.log('✓ TinaCMS loaded successfully');
          console.log('✓ Client ID: bd936801-9e30-4584-b0fa-4b8adf05c8e0');
          
          // Wait a moment for full initialization
          setTimeout(() => {
            console.log('✓ TinaCMS ready');
          }, 1000);
        } else {
          console.error('✗ TinaCMS failed to load');
          root.innerHTML = `
            <div class="tina-loading">
              <div class="tina-loader" style="background: #fff3cd; border: 1px solid #ffc107;">
                <h2 style="color: #856404; margin: 0 0 10px 0;">⚠️ Loading Error</h2>
                <p style="color: #856404; margin: 0;">TinaCMS failed to initialize.</p>
                <p style="color: #856404; font-size: 14px; margin: 20px 0 0 0;">
                  Please check your Client ID and Token in tina/config.ts
                </p>
                <button onclick="location.reload()" style="
                  margin-top: 20px;
                  padding: 10px 20px;
                  background: #667eea;
                  color: white;
                  border: none;
                  border-radius: 6px;
                  cursor: pointer;
                  font-weight: 600;
                ">
                  Retry
                </button>
              </div>
            </div>
          `;
        }
      });
    </script>
  </body>
</html>
